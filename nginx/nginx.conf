upstream backend {
    server web:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static_prod/;
        expires 30d;
    }
    
    location /media/ {
        alias /app/media/;
        expires 30d;
    }
}