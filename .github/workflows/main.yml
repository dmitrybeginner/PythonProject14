name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 . --max-line-length=120 --exclude=migrations,venv,__pycache__

  build_and_push:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/habits-tracker:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "--- Printing secrets.ENV_FILE_CONTENT for debugging ---"
            echo "${{ secrets.ENV_FILE_CONTENT }}"
            echo "--- End of ENV_FILE_CONTENT ---"

            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            
            COMPOSE_VERSION="v2.24.1"
            DOCKER_CLI_PLUGINS_DIR="$HOME/.docker/cli-plugins"
            mkdir -p "$DOCKER_CLI_PLUGINS_DIR"
            COMPOSE_DESTINATION="$DOCKER_CLI_PLUGINS_DIR/docker-compose"
            
            # Download and install docker-compose if not present or version mismatch
            if ! [ -x "$COMPOSE_DESTINATION" ] || ! ( "$COMPOSE_DESTINATION" version 2>/dev/null | grep -q "$COMPOSE_VERSION" ); then
              echo "Downloading docker-compose version ${COMPOSE_VERSION}"
              curl -SL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o "$COMPOSE_DESTINATION"
              chmod +x "$COMPOSE_DESTINATION"
            fi

            git fetch origin
            git reset --hard origin/develop
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_TOKEN }}
            
            export DOCKER_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/habits-tracker:${{ github.sha }}
            docker pull $DOCKER_IMAGE
            
            # Run docker-compose. If it fails, print logs and exit.
            if ! DOCKER_IMAGE=$DOCKER_IMAGE docker compose up -d --remove-orphans; then
              echo "--- docker-compose up failed, printing db logs... ---"
              docker compose logs db
              exit 1
            fi
